<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>No.202603-03 shin</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Darumadrop+One&family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Hina+Mincho&family=Kaisei+Decol:wght@400;700&family=Kiwi+Maru:wght@400;500&family=Klee+One:wght@400;600&family=Kosugi+Maru&family=Mochiy+Pop+P+One&family=New+Tegomin&family=Nico+Moji&family=Potta+One&family=Rampart+One&family=Reggae+One&family=RocknRoll+One&family=Shippori+Mincho:wght@400;700&family=Stick&family=Train+One&family=Yomogi&family=Yuji+Syuku&family=Yusei+Magic&family=Zen+Antique&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
        <style>
            *{
                box-sizing: border-box;
            }
            html, body {
                overflow-x: hidden;
                width: 100%;
            }

            @import url('');

            @keyframes purupuru {
                0% { transform: scale(1.1) translateX(0px) rotate(0deg); }
                5% { transform: scale(1.1) translateX(2px) rotate(2deg); }
                10% { transform: scale(1.1) translateX(4px) rotate(4deg); }
                15% { transform: scale(1.1) translateX(6px) rotate(6deg); }
                20% { transform: scale(1.1) translateX(8px) rotate(8deg); }
                25% { transform: scale(1.1) translateX(10px) rotate(10deg); }
                30% { transform: scale(1.1) translateX(8px) rotate(8deg); }
                35% { transform: scale(1.1) translateX(6px) rotate(6deg); }
                40% { transform: scale(1.1) translateX(4px) rotate(4deg); }
                45% { transform: scale(1.1) translateX(2px) rotate(2deg); }
                50% { transform: scale(1.1) translateX(0px) rotate(0deg); }
                55% { transform: scale(1.1) translateX(-2px) rotate(-2deg); }
                60% { transform: scale(1.1) translateX(-4px) rotate(-4deg); }
                65% { transform: scale(1.1) translateX(-6px) rotate(-6deg); }
                70% { transform: scale(1.1) translateX(-8px) rotate(-8deg); }
                75% { transform: scale(1.1) translateX(-10px) rotate(-10deg); }
                80% { transform: scale(1.1) translateX(-8px) rotate(-8deg); }
                85% { transform: scale(1.1) translateX(-6px) rotate(-6deg); }
                90% { transform: scale(1.1) translateX(-4px) rotate(-4deg); }
                95% { transform: scale(1.1) translateX(-2px) rotate(-2deg); }
                100% { transform: scale(1.1) translateX(0px) rotate(0deg); }
            }

            @keyframes noshinoshi {
                0% { transform: scale(0.1) rotate(2deg); }
                20% { transform: scale(0.2) rotate(-4deg); }
                40% { transform: scale(0.3) rotate(6deg); }
                60% { transform: scale(0.5) rotate(-8deg); }
                80% { transform: scale(0.8) rotate(10deg); }
                100% { transform: scale(1.2) rotate(0deg); }
            }

            body {
                font-family: 'Mochiy Pop P One', sans-serif;
                background-color: #f4f5ff; 
                color: #000000;
                text-align: center;
                margin: 0;
                padding: 20px;
                overflow-x: hidden;
            }

            .message-card {
                background-color: white;
                border-radius: 5px;
                padding: 30px 20px;
                padding-bottom: 90px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                margin-top: 20px;
                margin: 20px auto;
                position: relative;
            }

            .impact-text {
                font-family: 'Mochiy Pop P One', sans-serif;
                font-size: 50px;
                font-weight: bold;
                color: #0400ff;
            }

            .impact-text1 {
                font-family: 'Hachi Maru Pop', cursive;
                font-size: 30px;
                font-weight: bold;
                color: #0400ff;
            }

            .impact-text2 {
                font-family: 'Kaisei Decol', serif;
                font-size: 30px;
                font-weight: bold;
                color: #ff0000; 
                margin-bottom: 20px;
            }

            .normal-text {
                font-family: 'BIZ UDPGothic', sans-serif;
                font-size: 18px;
                line-height: 1.8; 
            }

            .flex-container {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 10px;
                margin-bottom: 10px;
            }

            .shin-right {
                position: absolute;
                bottom: -10px;
                right: -20px;
                width: 400px;
                display: inline-block;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none; 
                -webkit-user-drag: none;
            }

            .shin-left {
                position: absolute;
                bottom: -30px;
                left: -10px;
                width: 390px;
                display: inline-block;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none; 
                -webkit-user-drag: none;
            }

            .countdown-box {
                background: linear-gradient(45deg, #87cefa 0%, #3239ff 100%);
                background-color: #87cefa;
                color: white;
                border-radius: 15px;
                padding: 20px;
                margin-top: 30px;
                font-weight: bold;
            }

            #timer {
                font-family: 'Stick', sans-serif;
                font-size: 24px;
                margin: 10px 0;
            }

            #timer a {
                display: inline-block;
            }

            .secret-link {
                display: inline-block;
                background: linear-gradient(45deg, #ffb9f6 0%, #ff0fd3 100%);
                background-color: #ff69b4;
                color: white;
                padding: 15px 30px;
                border-radius: 30px;
                text-decoration: none;
                font-size: 20px;
            }

            .message-card .flex-container,
            .message-card .normal-text {
            position: relative;
            z-index: 2;
            }

            @media (max-width: 900px) and (orientation: portrait) {
                .flex-container {
                    flex-direction: column;
                    align-items: center;
                    gap: 0px;
                }
                .message-card {
                     padding-bottom: 120px; 
                }
                .impact-text1 {
                    font-size: 25px;
                }
                .impact-text2 {
                    font-size: 20px;
                }
                .normal-text {
                    font-size: 16px;
                }
                .shin-container {
                    width: 360px;
                    right: -80px;
                    bottom: -50px;
                }
                .shin-left {
                    width: 300px;
                    left: -50px;
                    bottom: -40px;
                }
            }

            @media (max-width: 900px) and (orientation: landscape) {
                .flex-container {
                    gap: 5px;
                }
                .impact-text1 {
                    font-size: 25px;
                }
                .impact-text2 {
                    font-size: 20px;
                }
                .normal-text {
                    font-size: 16px;
                }
                .shin-container {
                    width: 400px;
                    right: -80px;
                    bottom: -50px;
                }
                .shin-left {
                    width: 330px;
                }
            }

            @media (hover: hover) {
                .shin-left:hover {
                    animation: purupuru 0.5s infinite;
                }
                #timer a:hover {
                    transform: scale(1.1);
                    transition: transform 0.3s ease;
                }
            }

            .shin-right.is-walking {
                animation: noshinoshi 3s;
            }

            @media (hover: none) {
                .shin-left:active {
                    animation: purupuru 0.5s infinite;
                }
                #timer a:active {
                    transform: scale(1.05);
                    transition: transform 0.1s ease;
                }
            }
        </style>
    </head>

    <body>

        <h1>
            <div class="impact-text">
                SHIN
            </div>
        </h1>

        <div class="message-card">

            <div class="flex-container">
                <div class="normal-text">
                    理由なく一緒にいて楽しい
                </div>

                <div class="impact-text1">
                    心
                </div>
            </div>

            <div class="normal-text" style="margin-bottom: 100px;">
                安心感あるし場の空気を和やかにしてくれるから<br>いつも感謝してます<br>これからも一緒にいれたらいいな
            </div>

            <img src="shin.png" class="shin-right" ontouchstart="" alt="キャラクター">
            <img src="shin2.png" class="shin-left" ontouchstart="" alt="キャラクター">
        </div>

        <h2 id="countdown-title">
            <div class="impact-text2">大阪旅行</div><div class="normal-text">まであと...</div>
        </h2>

        <div class="countdown-box">
            <div id="timer">計算中...</div>
        </div>

        <script>
            var targetDate = new Date("2026/03/19 00:00:00").getTime();

            var x = setInterval(function() {
                var now = new Date().getTime();
                var distance = targetDate - now;

                var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if (distance > 0) {
                    document.getElementById("timer").innerText = days + "日 " + hours + "時間 " + minutes + "分 " + seconds + "秒";
                } else {
                    clearInterval(x);
                    document.getElementById("countdown-title").style.display = "none";
                    document.getElementById("timer").innerHTML = '<a href="Osaka.html" class="secret-link"> 大阪のしおり！ </a>';
                }
            }, 1000);
            const target = document.querySelector('.shin-right');
            const startAnimation = () => {
            target.classList.add('is-walking');
            };
            target.addEventListener('mouseenter', startAnimation);
            target.addEventListener('touchstart', startAnimation);
        </script>
    </body>
</html>
