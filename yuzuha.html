<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>No.202603-02 yuzuha</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Hina+Mincho&family=Kaisei+Decol:wght@400;700&family=Kiwi+Maru:wght@400;500&family=Klee+One:wght@400;600&family=Mochiy+Pop+P+One&family=New+Tegomin&family=Potta+One&family=Rampart+One&family=Reggae+One&family=RocknRoll+One&family=Shippori+Mincho:wght@400;700&family=Stick&family=Train+One&family=Yomogi&family=Yusei+Magic&family=Zen+Antique&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
        <style>
            *{
                box-sizing: border-box;
            }
            html, body {
                overflow-x: hidden;
                width: 100%;
            }

            @import url('');

            @keyframes pyonpyon {
                0% { transform: scale(1.1) translateX(0px) translateY(0px); }
                5% { transform: scale(1.1) translateX(10px) translateY(-8px); }
                10% { transform: scale(1.1) translateX(18px) translateY(-12px); }
                15% { transform: scale(1.1) translateX(24px) translateY(-12px); }
                20% { transform: scale(1.1) translateX(28px) translateY(-8px); }
                25% { transform: scale(1.1) translateX(32px) translateY(0px); }
                30% { transform: scale(1.1) translateX(28px) translateY(-8px); }
                35% { transform: scale(1.1) translateX(24px) translateY(-12px); }
                40% { transform: scale(1.1) translateX(18px) translateY(-12px); }
                45% { transform: scale(1.1) translateX(10px) translateY(-8px); }
                50% { transform: scale(1.1) translateX(0px) translateY(0px); }
                55% { transform: scale(1.1) translateX(-10px) translateY(-8px); }
                60% { transform: scale(1.1) translateX(-18px) translateY(-12px); }
                65% { transform: scale(1.1) translateX(-24px) translateY(-12px); }
                70% { transform: scale(1.1) translateX(-28px) translateY(-8px); }
                75% { transform: scale(1.1) translateX(-32px) translateY(0px); }
                80% { transform: scale(1.1) translateX(-28px) translateY(-8px); }
                85% { transform: scale(1.1) translateX(-24px) translateY(-12px); }
                90% { transform: scale(1.1) translateX(-18px) translateY(-12px); }
                95% { transform: scale(1.1) translateX(-10px) translateY(-8px); }
                100% { transform: scale(1.1) translateX(0px) translateY(0px); }
            }

            @keyframes purupuru {
                0% { transform: scale(1.1) translateX(0px); }
                5% { transform: scale(1.1) translateX(2px); }
                10% { transform: scale(1.1) translateX(4px); }
                15% { transform: scale(1.1) translateX(6px); }
                20% { transform: scale(1.1) translateX(8px); }
                25% { transform: scale(1.1) translateX(10px); }
                30% { transform: scale(1.1) translateX(8px); }
                35% { transform: scale(1.1) translateX(6px); }
                40% { transform: scale(1.1) translateX(4px); }
                45% { transform: scale(1.1) translateX(2px); }
                50% { transform: scale(1.1) translateX(0px); }
                55% { transform: scale(1.1) translateX(-2px); }
                60% { transform: scale(1.1) translateX(-4px); }
                65% { transform: scale(1.1) translateX(-6px); }
                70% { transform: scale(1.1) translateX(-8px); }
                75% { transform: scale(1.1) translateX(-10px); }
                80% { transform: scale(1.1) translateX(-8px); }
                85% { transform: scale(1.1) translateX(-6px); }
                90% { transform: scale(1.1) translateX(-4px); }
                95% { transform: scale(1.1) translateX(-2px); }
                100% { transform: scale(1.1) translateX(0px); }
            }

            body {
                font-family: 'Klee One', cursive;
                background-color: #fefff4; 
                color: #000000;
                text-align: center;
                margin: 0;
                padding: 20px;
                overflow-x: hidden;
            }

            .message-card {
                background-color: white;
                border-radius: 5px;
                padding: 30px 20px;
                padding-bottom: 90px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                margin-top: 20px;
                margin: 20px auto;
                position: relative;
            }

            .impact-text {
                font-family: 'Klee One', cursive;
                font-size: 50px;
                font-weight: bold;
                color: #ff7b00;
            }

            .impact-text1 {
                font-family: 'Shippori Mincho', serif;
                font-size: 30px;
                font-weight: bold;
                color: #ff7b00;
            }

            .impact-text2 {
                font-family: 'Kaisei Decol', serif;
                font-size: 30px;
                font-weight: bold;
                color: #ff0000; 
                margin-bottom: 20px;
            }

            .normal-text {
                font-family: 'Hina Mincho', serif;
                font-size: 18px;
                line-height: 1.8; 
            }

            .flex-container {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 10px;
                margin-bottom: 10px;
            }

            .yuzuha-right {
                position: absolute;
                bottom: -30px;
                right: -50px;
                width: 400px;
                display: inline-block;
            }

            .yuzuha-left {
                position: absolute;
                bottom: -30px;
                left: -10px;
                width: 450px;
                display: inline-block;
            }

            .countdown-box {
                background: linear-gradient(45deg, #87cefa 0%, #3239ff 100%);
                background-color: #87cefa;
                color: white;
                border-radius: 15px;
                padding: 20px;
                margin-top: 30px;
                font-weight: bold;
            }

            #timer {
                font-family: 'New Tegomin', serif;
                font-size: 24px;
                margin: 10px 0;
            }

            #timer a {
                display: inline-block;
                transition: transform 0.3s ease;
            }

            .secret-link {
                display: inline-block;
                background: linear-gradient(45deg, #ffb9f6 0%, #ff0fd3 100%);
                background-color: #ff69b4;
                color: white;
                padding: 15px 30px;
                border-radius: 30px;
                text-decoration: none;
                font-size: 20px;
            }

            .message-card .flex-container,
            .message-card .normal-text {
            position: relative;
            z-index: 2;
            }

            @media (max-width: 900px) and (orientation: portrait) {
                .flex-container {
                    flex-direction: column;
                    align-items: center;
                    gap: 0px;
                }
                .message-card {
                     padding-bottom: 120px; 
                }
                .impact-text1 {
                    font-size: 25px;
                }
                .impact-text2 {
                    font-size: 20px;
                }
                .normal-text {
                    font-size: 16px;
                }
                .yuzuha-right {
                    width: 300px;
                    right: -50px;
                    bottom: 35px;
                }
                .yuzuha-left {
                    width: 390px;
                    left: -80px;
                    bottom: -50px;
                }
            }

            @media (max-width: 900px) and (orientation: landscape) {
                .flex-container {
                    gap: 5px;
                }
                .impact-text1 {
                    font-size: 25px;
                }
                .impact-text2 {
                    font-size: 20px;
                }
                .normal-text {
                    font-size: 16px;
                }
                .yuzuha-right {
                    width: 380px;
                }
                .yuzuha-left {
                    width: 430px;
                }

            }
            
            @media (hover: hover) {
                .yuzuha-right:hover {
                    animation: purupuru 0.5s infinite;
                }
                .yuzuha-left:hover {
                    animation: pyonpyon 3s infinite;
                }
                #timer a:hover {
                    transform: scale(1.1);
                }
            }

            @media (hover: none) {
                .yuzuha-right:active {
                    animation: purupuru 0.5s infinite;
                    transition: transform 0.1s ease;
                }
                .yuzuha-left:active {
                    animation: pyonpyon 3s infinite;
                    transition: transform 0.1s ease;
                }
                #timer a:active {
                    transform: scale(1.05);
                    transition: transform 0.1s ease;
                }
            }
        </style>
    </head>

    <body>

        <h1>
            <div class="impact-text">
                YUZUHA
            </div>
        </h1>

        <div class="message-card">

            <div class="flex-container">
                <div class="normal-text">
                    お姉ちゃんみたいに頼れる
                </div>

                <div class="impact-text1">
                    柚葉
                </div>
            </div>

            <div class="normal-text" style="margin-bottom: 100px;">
                計画性だったり、責任感しっかりもってて<br>言わないけど尊敬してます。<br>これからもたのしいことしようね
            </div>


            <img src="yuzuha.png" class="yuzuha-right" alt="キャラクター">
            <img src="yuzuha2.png" class="yuzuha-left" alt="キャラクター">
        </div>

        <h2 id="countdown-title">
            <div class="impact-text2">大阪旅行</div><div class="normal-text">まであと...</div>
        </h2>

        <div class="countdown-box">
            <div id="timer">計算中...</div>
        </div>

        <script>
            var targetDate = new Date("2026/03/19 00:00:00").getTime();

            var x = setInterval(function() {
                var now = new Date().getTime();
                var distance = targetDate - now;

                var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((distance % (1000 * 60)) / 1000);

                if (distance > 0) {
                    document.getElementById("timer").innerText = days + "日 " + hours + "時間 " + minutes + "分 " + seconds + "秒";
                } else {
                    clearInterval(x);
                    document.getElementById("countdown-title").style.display = "none";
                    document.getElementById("timer").innerHTML = '<a href="大阪.html" class="secret-link"> 大阪のしおり！ </a>';
                }
            }, 1000);
        </script>
    </body>
</html>
